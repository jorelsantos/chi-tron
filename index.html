<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHI-TRON</title>
  <style>
    :root {
      --neon-cyan: #00d4ff;
      --hud-dim: rgba(160, 190, 255, 0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #05060a; overflow: hidden; }
    #map { position: absolute; inset: 0; }

    /* HUD chrome — never intercepts map interaction */
    .hud { position: absolute; z-index: 10; pointer-events: none; font-family: "SF Mono", "Menlo", monospace; }
    #wordmark {
      top: 18px; left: 22px;
      font-size: 22px; font-weight: 700; letter-spacing: 0.35em;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.9), 0 0 28px rgba(0, 212, 255, 0.45);
    }
    #wordmark small {
      display: block; font-size: 9px; font-weight: 400; letter-spacing: 0.42em;
      color: var(--hud-dim); text-shadow: none; margin-top: 4px;
    }
    #clock {
      top: 22px; right: 24px;
      font-size: 18px; letter-spacing: 0.18em; color: var(--hud-dim);
      text-shadow: 0 0 6px rgba(120, 160, 255, 0.35);
    }
    #status {
      top: 48px; right: 24px;
      font-size: 10px; letter-spacing: 0.3em; color: var(--hud-dim);
    }
    #status.live { color: #3bff6f; text-shadow: 0 0 6px rgba(59, 255, 111, 0.6); }
    #status.lost { color: #ff3b4e; text-shadow: 0 0 6px rgba(255, 59, 78, 0.6); }
    #disclaimer {
      bottom: 12px; left: 22px;
      font-size: 9px; letter-spacing: 0.14em; color: rgba(140, 160, 200, 0.4);
    }

    /* CRT overlays */
    #scanlines {
      position: absolute; inset: 0; z-index: 9; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px,
        rgba(0, 8, 20, 0.14) 3px, rgba(0, 8, 20, 0.14) 4px
      );
      mix-blend-mode: multiply;
    }
    #vignette {
      position: absolute; inset: 0; z-index: 9; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 3, 8, 0.55) 100%);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div class="hud" id="wordmark">CHI-TRON<small>CHICAGO TRANSIT GRID</small></div>
  <div class="hud" id="clock">--:--:--</div>
  <div class="hud" id="status">BOOT</div>
  <div class="hud" id="disclaimer">UNOFFICIAL FAN PROJECT — NOT AFFILIATED WITH CTA</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
